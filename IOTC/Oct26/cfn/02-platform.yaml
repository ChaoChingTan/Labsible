AWSTemplateFormatVersion: "2010-09-09"
Description: >
  02-platform (permanent). Public entry point and shared services for the
  Guacamole lab: ALB with HTTPS (ACM cert, DNS-validated in Route53) that returns
  a 503 page until a web stack attaches, Route53 alias record, S3 bucket for DB
  dumps, Secrets Manager secrets, and IAM instance profiles for web and guacd nodes.
  Requires 01-network. Domain name and hosted zone ID have NO defaults: supply
  them at deploy time (see README), never commit them.

Parameters:
  LabPrefix:
    Type: String
    Default: lab
    Description: Prefix for resource names and export names. Must match 01-network.
    AllowedPattern: "[a-z][a-z0-9-]{1,15}"

  DomainName:
    Type: String
    Description: Fully qualified lab hostname (for example labs.example.com). Supplied at deploy time.
    AllowedPattern: '^([a-z0-9]([a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,}$'

  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Route53 hosted zone that serves DomainName. Supplied at deploy time.

Resources:
  # ------------------------------------------------------------- Certificate
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - { Key: Name, Value: !Sub "${LabPrefix}-cert" }
        - { Key: Lab, Value: guac }

  # --------------------------------------------------------------------- ALB
  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets: !Split [",", { "Fn::ImportValue": !Sub "${LabPrefix}-AlbSubnetIds" }]
      SecurityGroups:
        - { "Fn::ImportValue": !Sub "${LabPrefix}-AlbSgId" }
      LoadBalancerAttributes:
        # Long-lived Guacamole WebSocket tunnels: keep idle connections open.
        - { Key: idle_timeout.timeout_seconds, Value: "3600" }
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: "true" }
      Tags:
        - { Key: Name, Value: !Sub "${LabPrefix}-alb" }
        - { Key: Lab, Value: guac }

  # Default action stays a friendly 503 between sessions. The web stack adds its
  # own target group and a listener rule at a higher priority.
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref Certificate
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: "503"
            ContentType: text/html
            MessageBody: "<html><body style=\"font-family:sans-serif;text-align:center;margin-top:20vh\"><h2>Lab is currently offline</h2><p>Please try again when your lab session starts.</p></body></html>"

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            StatusCode: HTTP_301

  DnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Alb.DNSName
        HostedZoneId: !GetAtt Alb.CanonicalHostedZoneID
        EvaluateTargetHealth: false

  # ---------------------------------------------------------------- S3 dumps
  DumpBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${LabPrefix}-dumps-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
          - Id: abort-incomplete-multipart
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - { Key: Lab, Value: guac }

  DumpBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DumpBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt DumpBucket.Arn
              - !Sub "${DumpBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  # ----------------------------------------------------------------- Secrets
  # Permanent, so a recreated database and the web nodes always agree.
  DbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Guacamole database credentials
      GenerateSecretString:
        SecretStringTemplate: '{"username":"guacamole"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true
      Tags:
        - { Key: Lab, Value: guac }

  GuacAdminSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Guacamole administrator login
      GenerateSecretString:
        SecretStringTemplate: '{"username":"guacadmin"}'
        GenerateStringKey: password
        PasswordLength: 24
        ExcludePunctuation: true
      Tags:
        - { Key: Lab, Value: guac }

  # --------------------------------------------------------------------- IAM
  # Web nodes: SSM shell, CloudWatch, read the DB secret, read/write the dump
  # bucket. The Guacamole admin secret is read by the operator running the roster
  # sync, not by the nodes. Kali instances get NO role. The Kali desktop login is
  # the fixed kali/kali account: it is reachable only from the guacd security group,
  # and each student's unique Guacamole password is the gatekeeper.
  WebRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/CloudWatchAgentServerPolicy"
      Policies:
        - PolicyName: web-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DbSecret
              - Effect: Allow
                Action: [s3:ListBucket, s3:GetBucketLocation]
                Resource: !GetAtt DumpBucket.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub "${DumpBucket.Arn}/*"
      Tags:
        - { Key: Lab, Value: guac }

  WebInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref WebRole]

  GuacdRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/CloudWatchAgentServerPolicy"
      Tags:
        - { Key: Lab, Value: guac }

  GuacdInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref GuacdRole]

Outputs:
  DomainName:
    Value: !Ref DomainName
    Export: { Name: !Sub "${LabPrefix}-DomainName" }
  HttpsListenerArn:
    Value: !Ref HttpsListener
    Export: { Name: !Sub "${LabPrefix}-HttpsListenerArn" }
  AlbDnsName:
    Value: !GetAtt Alb.DNSName
  DumpBucketName:
    Value: !Ref DumpBucket
    Export: { Name: !Sub "${LabPrefix}-DumpBucketName" }
  DbSecretArn:
    Value: !Ref DbSecret
    Export: { Name: !Sub "${LabPrefix}-DbSecretArn" }
  GuacAdminSecretArn:
    Value: !Ref GuacAdminSecret
    Export: { Name: !Sub "${LabPrefix}-GuacAdminSecretArn" }
  WebInstanceProfileArn:
    Value: !GetAtt WebInstanceProfile.Arn
    Export: { Name: !Sub "${LabPrefix}-WebInstanceProfileArn" }
  GuacdInstanceProfileArn:
    Value: !GetAtt GuacdInstanceProfile.Arn
    Export: { Name: !Sub "${LabPrefix}-GuacdInstanceProfileArn" }